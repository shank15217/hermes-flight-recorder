[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-flight-recorder"
version = "0.3.0.dev1"
description = "Opt-in Mainplane-style append-only statefile sessions for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shank15217", email = "shank15217@users.noreply.github.com" }]
keywords = ["hermes", "agent", "statefile", "context", "prompt-cache", "session"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/shank15217/hermes-flight-recorder"
"Prior art" = "https://github.com/mainplane-ai/mainplane"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true